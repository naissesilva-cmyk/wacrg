# CI: validate the YAML corpus and the Nora WhatsApp worker.

name: CI

on:
  pull_request:
    paths:
      - "spec/**"
      - "corpus/**"
      - "scripts/**"
      - "package.json"
      - "nora-worker/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, nora-render-worker]
    paths:
      - "spec/**"
      - "corpus/**"
      - "scripts/**"
      - "package.json"
      - "nora-worker/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-check:
    name: Validate corpus and check generated output
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm i

      - name: Validate corpus (schemas + referential integrity)
        run: npm run validate

      - name: Check generated docs and coverage are current
        run: npm run check

  nora-whatsapp-worker:
    name: Validate Nora WhatsApp worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nora-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        run: npm install

      - name: Typecheck worker
        run: npx tsc --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 --skipLibCheck src/index.ts
